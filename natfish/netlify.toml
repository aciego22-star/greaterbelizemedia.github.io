# NATFISH V1 — Netlify configuration
#
# The site is plain static files, so there is no build command. Netlify serves
# the folder as-is and index.html is the entry point.

[build]
  publish = "."

# The V1 used a different page structure. These keep any link that was already
# shared pointing at the right place.
[[redirects]]
  from = "/cooperative.html"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/seafood.html"
  to = "/seafood-services.html"
  status = 301
  force = true

[[redirects]]
  from = "/buyers.html"
  to = "/contact.html#order"
  status = 301
  force = true

# Image and stylesheet filenames are stable, so they cache hard. HTML must not,
# or a redeploy would leave visitors on the previous version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
