<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sutherland Septic Services vacuum truck at a Belize property">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a4a2b"/>
      <stop offset="0.5" stop-color="#0d6b3d"/>
      <stop offset="1" stop-color="#146f45"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3a22"/>
      <stop offset="1" stop-color="#062616"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f5"/>
      <stop offset="1" stop-color="#c7d2cb"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a9a5c"/>
      <stop offset="1" stop-color="#0d6b3d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#8ff0bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8ff0bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <circle cx="1250" cy="250" r="130" fill="#bff3d5" opacity="0.35"/>

  <!-- Distant tree line -->
  <path d="M0 560 Q 200 500 400 545 T 800 540 T 1200 545 T 1600 535 L1600 900 L0 900 Z" fill="#0c4227" opacity="0.7"/>

  <!-- Palm trees (Belize) -->
  <g opacity="0.85">
    <g transform="translate(160 560)">
      <rect x="-6" y="-150" width="12" height="150" rx="6" fill="#0a3a22"/>
      <path d="M0 -150 q -70 -20 -120 -50 q 60 5 120 25" fill="#10633a"/>
      <path d="M0 -150 q 70 -20 120 -50 q -60 5 -120 25" fill="#10633a"/>
      <path d="M0 -150 q -30 -60 -50 -110 q 40 40 50 90" fill="#127845"/>
      <path d="M0 -150 q 30 -60 50 -110 q -40 40 -50 90" fill="#127845"/>
    </g>
    <g transform="translate(1440 580) scale(0.85)">
      <rect x="-6" y="-150" width="12" height="150" rx="6" fill="#0a3a22"/>
      <path d="M0 -150 q -70 -20 -120 -50 q 60 5 120 25" fill="#10633a"/>
      <path d="M0 -150 q 70 -20 120 -50 q -60 5 -120 25" fill="#10633a"/>
      <path d="M0 -150 q -30 -60 -50 -110 q 40 40 50 90" fill="#127845"/>
      <path d="M0 -150 q 30 -60 50 -110 q -40 40 -50 90" fill="#127845"/>
    </g>
  </g>

  <!-- Ground / road -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#ground)"/>
  <rect x="0" y="600" width="1600" height="46" fill="#0e4f30"/>
  <path d="M0 760 L1600 720" stroke="#0a3a22" stroke-width="120" opacity="0.5"/>

  <!-- The septic vacuum truck -->
  <g transform="translate(470 372)">
    <!-- shadow -->
    <ellipse cx="330" cy="352" rx="360" ry="34" fill="#03170d" opacity="0.55"/>

    <!-- chassis -->
    <rect x="70" y="300" width="560" height="30" rx="8" fill="#12211a"/>

    <!-- vacuum tank -->
    <rect x="150" y="120" width="420" height="185" rx="92" fill="url(#tank)"/>
    <rect x="150" y="120" width="420" height="185" rx="92" fill="none" stroke="#9fb0a6" stroke-width="3"/>
    <ellipse cx="565" cy="212" rx="26" ry="92" fill="#dbe4de"/>
    <ellipse cx="565" cy="212" rx="26" ry="92" fill="none" stroke="#9fb0a6" stroke-width="3"/>
    <!-- tank band + branding plate -->
    <rect x="250" y="170" width="230" height="86" rx="14" fill="#0d6b3d"/>
    <text x="365" y="205" text-anchor="middle" font-family="'Sora',Arial,sans-serif" font-weight="800" font-size="30" fill="#ffffff">SUTHERLAND</text>
    <text x="365" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#8ff0bf" letter-spacing="2">SEPTIC SERVICES</text>

    <!-- rear hose reel -->
    <circle cx="120" cy="230" r="42" fill="#20302a"/>
    <circle cx="120" cy="230" r="20" fill="#0d6b3d"/>

    <!-- cab -->
    <path d="M570 200 h95 a24 24 0 0 1 22 15 l30 78 a20 20 0 0 1 2 8 v24 h-176 v-125 a10 10 0 0 1 10 -10 z" fill="url(#cab)"/>
    <path d="M600 218 h60 a14 14 0 0 1 13 9 l20 52 h-93 z" fill="#bfe9d3" opacity="0.85"/>
    <rect x="726" y="300" width="19" height="30" rx="4" fill="#12211a"/>
    <!-- headlight -->
    <circle cx="740" cy="290" r="9" fill="#fff3c4"/>

    <!-- wheels -->
    <g>
      <circle cx="240" cy="330" r="52" fill="#101814"/>
      <circle cx="240" cy="330" r="24" fill="#3a4a42"/>
      <circle cx="420" cy="330" r="52" fill="#101814"/>
      <circle cx="420" cy="330" r="24" fill="#3a4a42"/>
      <circle cx="660" cy="330" r="52" fill="#101814"/>
      <circle cx="660" cy="330" r="24" fill="#3a4a42"/>
    </g>
  </g>
</svg>
