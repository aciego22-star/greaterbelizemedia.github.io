# Netlify configuration — Sutherland Septic Services
# If you connect this repository to Netlify and set the base directory to
# "sutherland-septic", this file publishes the site as-is (no build step).

[build]
  publish = "."
  command = ""

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

# Caching. CSS/JS are revalidated every load (they share a stable filename,
# so 'immutable' would serve stale copies after a redeploy). A ?v= query on
# the <link>/<script> also busts any previously-cached immutable copy now.
# Images use a short cache so updated photos propagate quickly.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Pretty URLs: /about instead of /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
