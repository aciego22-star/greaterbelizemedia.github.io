# Netlify settings for Cojac's Sumptuous Rumpopo.
# If this folder lives inside a larger repository, set "Base directory" to cojac-rumpopo in Netlify.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every page is pre-rendered to its own folder (e.g. /flavours/index.html), so
# direct visits and refreshes work without rewrites. Unknown paths get the
# branded "page not found" view with a real 404 status.
[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "SAMEORIGIN"
