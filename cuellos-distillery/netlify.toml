# Cuello's Distillery Ltd. - V1 concept · Netlify configuration
# Static site, no build step. Deploy this folder as the publish root.

[build]
  publish = "."

# Assets revalidate on every visit (filenames are not fingerprinted, so
# long immutable caching would keep old JS/CSS alive after a redeploy).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
