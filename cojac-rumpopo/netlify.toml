# Netlify settings for Cojac's Sumptuous Rumpopo.
# If this folder lives inside a larger repository, set "Base directory" to cojac-rumpopo in Netlify.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every page is pre-rendered to its own folder (e.g. /flavours/index.html), so
# direct visits and refreshes work without rewrites. Unknown paths get the
# branded "page not found" view with a real 404 status.
# The old Netlify address sends everyone to the official domain.
[[redirects]]
  from = "https://shiny-truffle-ef9459.netlify.app/*"
  to = "https://rumpopo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://shiny-truffle-ef9459.netlify.app/*"
  to = "https://rumpopo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/banks/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
