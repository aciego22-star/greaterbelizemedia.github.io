# Netlify configuration — Sutherland Septic Services
# If you connect this repository to Netlify and set the base directory to
# "sutherland-septic", this file publishes the site as-is (no build step).

[build]
  publish = "."
  command = ""

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

# Long cache for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URLs: /about instead of /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
