# NATFISH V1 — Netlify configuration
#
# The site is plain static files, so there is no build command. Netlify serves
# the folder as-is and index.html is the entry point.

[build]
  publish = "."

# The V1 used a different page structure. These keep any link that was already
# shared pointing at the right place.
[[redirects]]
  from = "/cooperative.html"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/seafood.html"
  to = "/seafood-services.html"
  status = 301
  force = true

[[redirects]]
  from = "/buyers.html"
  to = "/contact.html#order"
  status = 301
  force = true

# The Insights section is addressed by .html like every other page, because
# that is this site's routing convention and the canonical must match the URL
# the host actually serves. These accept the directory-style forms as well and
# send them to the canonical page, so a link written either way still lands.
[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 301
  force = true

[[redirects]]
  from = "/insights/"
  to = "/insights.html"
  status = 301
  force = true

[[redirects]]
  from = "/insights/belizean-caribbean-spiny-lobster"
  to = "/insights-belizean-caribbean-spiny-lobster.html"
  status = 301
  force = true

[[redirects]]
  from = "/insights/belizean-caribbean-spiny-lobster/"
  to = "/insights-belizean-caribbean-spiny-lobster.html"
  status = 301
  force = true

# Image and stylesheet filenames are stable, so they cache hard. HTML must not,
# or a redeploy would leave visitors on the previous version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The favicon set and the manifest change about as often as the logo does.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# ===========================================================================
# PREVIEW ONLY - DELETE THIS ENTIRE BLOCK WHEN THE SITE GOES LIVE ON natfish.bz
# ===========================================================================
#
# While the site is demonstrated on the temporary Netlify subdomain, this
# header keeps that host out of search results. Without it the preview would
# compete with natfish.bz for the same content once the real domain is live.
#
# It is a header rather than a robots.txt Disallow on purpose: a disallowed URL
# can still be indexed from an inbound link, whereas noindex is obeyed. It is
# also not a meta tag in the pages, so removing it is one deletion here rather
# than a rebuild of every page.
#
# TO GO LIVE:
#   1. Delete this block, from the banner above to the end of the file.
#   2. Redeploy.
#   3. Fetch https://natfish.bz/ and confirm the response carries NO
#      X-Robots-Tag header:  curl -sI https://natfish.bz/ | grep -i robots
#   4. Submit https://natfish.bz/sitemap.xml in Google Search Console.
#
# robots.txt and every canonical tag are already written for production and
# need no change at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
