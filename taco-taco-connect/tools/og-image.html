<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- Archivo Black (SIL Open Font License 1.1), the latin subset Google Fonts
     serves, kept beside this template so the card renders identically with no
     network. It is a build-time file: nothing here is shipped to the site. -->
<style>
@font-face{font-family:"Archivo Black";font-style:normal;font-weight:400;
  src:url("archivo-black-latin.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;
 font-family:"Archivo Black",sans-serif;color:#123328;
 background:
  radial-gradient(80% 62% at 4% -6%, rgba(242,58,12,.94), transparent 58%),
  radial-gradient(64% 54% at 99% 2%, rgba(255,216,116,.85), transparent 62%),
  linear-gradient(150deg,#F23A0C 0%,#FC8614 24%,#FA9A10 54%,#F6B205 84%,#EFA70D 100%);}
body::after{content:"";position:absolute;inset:0;opacity:.17;
 background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20viewBox%3D%270%200%20132%20132%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23FFF6E5%27%20stroke-width%3D%272.1%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cg%20transform%3D%27translate%286%2010%29%20rotate%28-11%2020%2020%29%27%3E%3Cpath%20d%3D%27M4%2028a16%2016%200%200%201%2032%200c0%202-1.3%203-3%203H7c-1.7%200-3-1-3-3ZM9.5%2026.5c.5-7%205-12%2010.5-12s10%205%2010.5%2012M12%2019.5c2-2.2%204.6-3%206.4-1.3M21.5%2017.6c2-1.4%204.3-.6%205.6%201.5%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%2872%2042%29%20rotate%2815%2020%2020%29%27%3E%3Cpath%20d%3D%27M4%2028a16%2016%200%200%201%2032%200c0%202-1.3%203-3%203H7c-1.7%200-3-1-3-3ZM9.5%2026.5c.5-7%205-12%2010.5-12s10%205%2010.5%2012M12%2019.5c2-2.2%204.6-3%206.4-1.3M21.5%2017.6c2-1.4%204.3-.6%205.6%201.5%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%2826%2078%29%20rotate%286%2020%2020%29%27%3E%3Cpath%20d%3D%27M4%2028a16%2016%200%200%201%2032%200c0%202-1.3%203-3%203H7c-1.7%200-3-1-3-3ZM9.5%2026.5c.5-7%205-12%2010.5-12s10%205%2010.5%2012M12%2019.5c2-2.2%204.6-3%206.4-1.3M21.5%2017.6c2-1.4%204.3-.6%205.6%201.5%27%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E");background-size:132px 132px;}
.orb{position:absolute;left:310px;top:315px;transform:translate(-50%,-50%);perspective:1200px}
.stage{position:relative;width:580px;height:580px;transform-style:preserve-3d}
.ring{position:absolute;left:50%;top:58%;border-radius:50%;transform:translate(-50%,-50%) rotateX(68deg)}
.r1{width:470px;height:470px;border:5px solid #FFFDF5;
    box-shadow:0 0 22px rgba(255,255,255,.75), 0 8px 22px rgba(120,38,0,.45)}
.r2{width:580px;height:580px;border:2px dashed rgba(255,251,240,.6)}
.r3{width:330px;height:330px;border:2px solid rgba(18,51,40,.5)}
img{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:440px;
    filter:drop-shadow(0 14px 18px rgba(120,38,0,.45)) drop-shadow(0 32px 48px rgba(96,30,0,.4))}
.txt{position:absolute;left:600px;top:50%;transform:translateY(-50%);width:570px}
.bar{display:flex;width:170px;height:8px;border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar i{flex:1}.bar i:nth-child(1){background:#F5B301}.bar i:nth-child(2){background:#F27321}
.bar i:nth-child(3){background:#D62828}.bar i:nth-child(4){background:#12734A}
h1{font-size:76px;line-height:.94;text-transform:uppercase;letter-spacing:-.02em;color:#FFF8EC;
 text-shadow:3px 0 0 #123328,-3px 0 0 #123328,0 3px 0 #123328,0 -3px 0 #123328,
             3px 3px 0 #123328,-3px -3px 0 #123328,3px -3px 0 #123328,-3px 3px 0 #123328,
             0 14px 30px rgba(92,28,0,.4)}
p{font-size:28px;margin-top:24px;color:#123328;letter-spacing:.01em}
.addr{margin-top:26px;font-family:system-ui,sans-serif;font-size:20px;font-weight:700;
 color:rgba(18,51,40,.82);letter-spacing:.02em;white-space:nowrap}
</style></head><body>
<div class="orb"><div class="stage">
  <div class="ring r2"></div><div class="ring r1"></div><div class="ring r3"></div>
  <img src="../assets/mascot.png">
</div></div>
<div class="txt">
  <div class="bar"><i></i><i></i><i></i><i></i></div>
  <h1>Taco Taco Connect</h1>
  <p>Everything Taco Taco. One place.</p>
  <div class="addr">11 Aloe Vera Ave &middot; Belmopan &middot; Belize</div>
</div>
</body></html>
